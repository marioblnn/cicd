name: cd

on:
    push:
        branches:
            - main

jobs:
    Deploy:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Setup Go
          uses: actions/setup-go@v5
          with:  
            go-version: "1.27.1"

        - name: Build
          run: ./scripts/buildprod.sh